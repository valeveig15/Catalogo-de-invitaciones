<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<title>ArteDeco Studio · Catálogo XV · 10 modelos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Serif+Display&family=Italiana&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="catalog-ui" aria-label="Navegación del catálogo">
  <button class="catalog-arrow catalog-prev" id="catalogPrev" aria-label="Modelo anterior">‹</button>
  <div class="catalog-status">
    <span id="catalogModel">Modelo 01</span>
    <div class="catalog-dots" id="catalogDots" aria-label="Modelos"></div>
  </div>
  <button class="catalog-arrow catalog-next" id="catalogNext" aria-label="Modelo siguiente">›</button>
</div>

<main class="catalog" id="catalog" aria-label="Catálogo de invitaciones digitales de XV años"></main>

<button class="music-control" id="musicControl" type="button" aria-label="Activar música" aria-pressed="false">
  <span class="music-note" aria-hidden="true">♪</span>
  <span class="music-wave" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-backdrop" data-lightbox-close aria-label="Cerrar"></button>
  <button class="lightbox-close" data-lightbox-close aria-label="Cerrar">×</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Foto anterior">‹</button>
  <figure class="lightbox-stage"><img id="lightboxImg" alt=""><figcaption id="lightboxCaption"></figcaption></figure>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Foto siguiente">›</button>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <button class="modal-backdrop" data-close aria-label="Cerrar"></button>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-x" data-close aria-label="Cerrar">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<noscript>Este catálogo necesita JavaScript para mostrar los modelos y sus funciones interactivas.</noscript>
<script src="script.js" defer></script>
</body>
</html>
