<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Especial</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tarjeta Contenedora Principal -->
  <main class="invitacion-card">
    
    <!-- SECCIÓN SUPERIOR: Dragón Volando Animado -->
    <section class="dragon-section">
      <div class="dragon-wrapper">
        <svg class="dragon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
          <g class="dragon-body">
            <!-- Cabeza y Cuello -->
            <path d="M140 50 Q160 45 170 40 Q165 50 150 55 Z" fill="#2d3748" />
            <!-- Cuerpo y Cola -->
            <path d="M80 60 Q110 50 140 50 Q110 70 80 65 Q50 60 30 70 Q45 62 70 60" fill="#2d3748" />
            <!-- Ala Izquierda / Trasera -->
            <path class="wing wing-back" d="M105 52 L70 20 Q95 25 110 40 Z" fill="#4a5568" />
            <!-- Ala Derecha / Frontal -->
            <path class="wing wing-front" d="M110 52 L80 10 Q115 20 125 45 Z" fill="#1a202c" />
          </g>
        </svg>
      </div>
      <p class="dragon-subtext">✦ ¡Una gran aventura está por comenzar! ✦</p>
    </section>

    <!-- SECCIÓN CENTRAL: Información del Evento -->
    <section class="contenido-texto">
      <h1>¡Estás Invitado!</h1>
      <p class="evento-subtitulo">Acompáñanos a celebrar un día lleno de magia, naturaleza y momentos inolvidables.</p>
      
      <div class="detalles-box">
        <p><strong>📅 Fecha:</strong> Sábado, 24 de Octubre</p>
        <p><strong>⏰ Hora:</strong> 17:00 hs</p>
        <p><strong>📍 Lugar:</strong> El Jardín Secreto</p>
      </div>

      <a href="#confirmar" class="btn-confirmar">Confirmar Asistencia</a>
    </section>

    <!-- SECCIÓN INFERIOR: Jardín de Plantas en Maceta (SVG) -->
    <section class="jardin-container">
      <svg class="plantas-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370">
        <!-- Estante / Suelo -->
        <line x1="20" y1="360" x2="580" y2="360" stroke="#1f2421" stroke-width="2.5" stroke-linecap="round"/>

        <!-- 1. MACETA IZQUIERDA (FICUS / ARBOLITO) -->
        <g id="maceta-1-ficus">
          <ellipse cx="120" cy="358" rx="35" ry="5" fill="#cf7a58" stroke="#1f2421" stroke-width="2"/>
          <path d="M 88,352 L 152,352 L 148,358 L 92,358 Z" fill="#b86141" stroke="#1f2421" stroke-width="2"/>
          <path d="M 80,260 L 160,260 L 148,352 L 92,352 Z" fill="#df825f" stroke="#1f2421" stroke-width="2.5" stroke-linejoin="round"/>

          <path d="M 120,260 Q 115,220 120,180" stroke="#1f2421" stroke-width="3" fill="none"/>
          <path d="M 118,240 C 80,240 70,205 105,210 C 118,220 118,235 118,240 Z" fill="#2c5e53" stroke="#1f2421" stroke-width="2"/>

        </g>

        <!-- 2. MACETA MINI PEQUEÑA -->
        <g id="maceta-2-mini">
          <ellipse cx="150" cy="359" rx="20" ry="3" fill="#b86141" stroke="#1f2421" stroke-width="1.8"/>
          <path d="M 132,300 L 168,300 L 162,358 L 138,358 Z" fill="#cf7a58" stroke="#1f2421" stroke-width="2" stroke-linejoin="round"/>

          <ellipse cx="145" cy="285" rx="5" ry="3" fill="#204840" stroke="#1f2421" stroke-width="1.5" transform="rotate(-20 145 285)"/>
          <ellipse cx="155" cy="275" rx="5" ry="3" fill="#3a7568" stroke="#1f2421" stroke-width="1.5" transform="rotate(20 155 275)"/>
          <ellipse cx="150" cy="263" rx="6" ry="4" fill="#4d8b7d" stroke="#1f2421" stroke-width="1.5"/>

        <!-- 5. MACETA DERECHA MEDIANA (POTOS / COLGANTE) -->
        <g id="maceta-5-potos">

          <path d="M 360,240 L 480,240 L 460,352 L 380,352 Z" fill="#df825f" stroke="#1f2421" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- 6. MACETA ROSADA CON ONDAS -->
        <g id="maceta-6-rosada">
          <ellipse cx="490" cy="358" rx="28" ry="4" fill="#d87352" stroke="#1f2421" stroke-width="1.8"/>

          <path d="M 465,315 Q 490,325 515,315" fill="none" stroke="#e76f51" stroke-width="2.5"/>
          
          <path d="M 480,265 C 530,250 560,300 480,345" fill="none" stroke="#1f2421" stroke-width="2"/>
          <path d="M 525,268 C 540,255 550,275 530,280 Z" fill="#52b788" stroke="#1f2421" stroke-width="1.5"/>
          <path d="M 520,305 C 545,300 540,325 515,320 Z" fill="#74c69d" stroke="#1f2421" stroke-width="1.5"/>

      </svg>
    </section>

  </main>

</body>
</html>
